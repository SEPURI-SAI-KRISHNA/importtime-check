name: Bug report
description: Report reproducible incorrect behavior in importtime-check.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not disclose security
        vulnerabilities here; use the private security reporting link instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Concisely describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest commands, code, and inputs that reproduce it.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: importtime-check version
      placeholder: "For example: 0.1.0a1 or an exact commit"
    validations:
      required: true

  - type: dropdown
    id: python
    attributes:
      label: Python version
      options:
        - "3.11"
        - "3.12"
        - "3.13"
        - "3.14"
        - Other or pre-release
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "For example: Ubuntu 24.04, Windows 11, or macOS 15"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Remove credentials, tokens, private paths, and other sensitive data.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched open and closed issues for an existing report.
          required: true
        - label: This report does not contain a security vulnerability or secret.
          required: true
