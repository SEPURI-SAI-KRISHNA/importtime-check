name: Import-time baseline check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CPython 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install locked import environment
        run: |
          python -m pip install --requirement ci/requirements-importtime.txt
          python -m pip check

      - name: Check reviewed baseline and exact target set
        run: |
          importtime-check check \
            --baseline ci/importtime-baseline.json \
            --module packaging \
            --profile gh-ubuntu-24.04
