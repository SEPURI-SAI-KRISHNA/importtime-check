[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "importtime-check"
dynamic = ["version"]
description = "Detect Python import-time regressions in CI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []
keywords = [
    "ci",
    "import-time",
    "performance",
    "pytest",
    "regression-testing",
    "startup-time",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Benchmark",
    "Typing :: Typed",
]

[project.scripts]
importtime-check = "importtime_check._cli:main"

[project.optional-dependencies]
pytest = ["pytest>=9.1.1"]

[project.urls]
Repository = "https://github.com/SEPURI-SAI-KRISHNA/importtime-check"
Issues = "https://github.com/SEPURI-SAI-KRISHNA/importtime-check/issues"

[dependency-groups]
test = [
    "coverage[toml]>=7.16.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
quality = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]
packaging = [
    "build>=1.6.1",
    "twine>=7.0.0",
]
dev = [
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "packaging" },
]

[tool.hatch.version]
path = "src/importtime_check/_version.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/tools",
    "/docs",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/NOTICE",
    "/README.md",
    "/SECURITY.md",
    "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/importtime_check"]

[tool.ruff]
required-version = ">=0.16.8"
target-version = "py311"
line-length = 88
preview = false

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true
files = ["src", "tests", "tools"]
exclude = ["^\\.tmp/"]

[tool.pytest]
minversion = "9.1"
addopts = [
    "-ra",
    "--cov=importtime_check",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
strict = true
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly isolated external facility",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_dirs = ["src/importtime_check"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
skip_empty = false
